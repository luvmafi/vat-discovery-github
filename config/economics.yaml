# Unit-cost inputs for the economics model (src/vat_discovery/economics/model.py).
#
# `basis` on every input says where the number came from -- never silently
# blend an OBSERVED figure (measured in this project's own pilots) with a
# MARKET_ESTIMATE (a real, dated, sourced published price) or an ASSUMPTION
# (a stated guess with no source) without flagging which is which.
#
# Retrieved 2026-08-16. Prices change; re-check before using this for a real
# budget decision.

currency: USD
fx_gbp_to_usd: 1.35  # xe.com/Bloomberg mid-market rate, retrieved 2026-08-16. For the manual-review line only.

inputs:
  search:
    basis: OBSERVED_RATIO_TIMES_MARKET_PRICE
    price_per_1000_queries_usd: 15.0
    price_source: "SerpAPI Developer tier (5,000 searches/month), retrieved 2026-08-16"
    observed_requests_per_company: 1.214
    observed_basis: "experiments/source_website_round3.py: 28 companies, 29 search calls + 5 verification fetches = 34 requests / 28 companies"

  ocr:
    basis: HYPOTHETICAL_UNUSED_SO_FAR
    price_per_1000_pages_usd: 1.50
    price_source: "Google Cloud Vision OCR (TEXT_DETECTION), pay-as-you-go, retrieved 2026-08-16"
    observed_pages_per_company: 0.0
    observed_basis: "OCR has never been triggered in any pilot -- extraction/pdf.py is TEXT-layer only by design; no PDF has needed it yet"

  storage:
    basis: ESTIMATED
    price_per_gb_month_usd: 0.023
    price_source: "AWS S3 Standard, first 50TB/month tier, US East (N. Virginia), retrieved 2026-08-16"
    estimated_kb_per_company_record: 5.0
    estimated_basis: "Rough size of one company + candidate + provenance row set; not measured against a populated database at scale"

  manual_review:
    basis: ASSUMPTION_NOT_OBSERVED
    hourly_rate_gbp: 14.0
    rate_source: "UK Junior Data Analyst/Researcher average hourly rate (Glassdoor UK, retrieved 2026-08-16)"
    assumed_minutes_per_company: 3.0
    assumed_basis: "Not measured against a real timed human review session -- a stated planning assumption only, to be replaced once Phase 10 manual validation actually runs and is timed"

  verification:
    basis: UNAVAILABLE_UNTIL_CREDENTIALED
    price_per_call_usd: 0.0
    price_source: "HMRC Check a UK VAT Number API is currently documented as free to call once credentialed, but credentials/onboarding are themselves ungranted -- see hmrc_experiment.py"

  engineering_ops:
    basis: NOT_ESTIMATED
    note: "No defensible unit figure exists for this yet; left out of the total rather than invented. See docs/economics.md."

observed_pipeline_rates:
  # From experiments/source_website.py + _round2.py + _round3.py combined:
  # 36 distinct companies piloted, 2 produced a real first-party VAT candidate.
  candidate_discovery_rate: 0.0556
  candidate_discovery_rate_basis: "2 / 36 companies piloted across rounds 1-3 (docs/findings.md)"
  # No candidate has ever been run through an authoritative verifier (no HMRC
  # credentials exist) -- this is UNAVAILABLE, not zero and not assumed equal
  # to the candidate rate.
  verified_discovery_rate: null
