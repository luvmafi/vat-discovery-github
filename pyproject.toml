[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-vat-discovery"
version = "0.1.0"
description = "Evidence-first UK VAT identifier discovery research POC"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "pypdf>=4.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fpdf2>=2.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
